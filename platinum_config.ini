# Platinum Tier Configuration
# This file contains configuration for both Cloud and Local Executives

[VAULT]
# Path to the vault directory
VAULT_PATH = ./vault

# Remote repository URL for vault sync (leave empty for local-only operation)
REMOTE_REPO_URL =

# Sync interval in seconds
SYNC_INTERVAL = 30

[EXECUTIVE]
# Executive type: cloud or local
EXECUTIVE_TYPE = local

# Whether to run continuously (as a service)
CONTINUOUS_RUN = True

[CLOUD_OPERATIONS]
# Operations allowed for Cloud Executive
EMAIL_TRIAGE = True
DRAFT_REPLY = True
SOCIAL_POST_DRAFT = True
SOCIAL_POST_SCHEDULE = True
WEEKLY_AUDIT_READ = True
ODOO_READ = True

[LOCAL_OPERATIONS]
# Operations allowed for Local Executive
APPROVAL = True
WHATSAPP_SESSION = True
PAYMENTS_BANKING = True
FINAL_SEND = True
FINAL_POST = True
DASHBOARD_WRITE = True
EMAIL_SEND = True
SOCIAL_POST_EXECUTE = True
ODOO_EXECUTE = True

[SYNC]
# Sync exclusions (never sync these files/directories)
EXCLUSIONS = .env,*.env,tokens.json,credentials.json,token.json,whatsapp_session*,banking_creds*,*_token.json,*_session.json,WhatsApp/,Banking/,Payments/

[LOGGING]
# Log level: DEBUG, INFO, WARNING, ERROR
LOG_LEVEL = INFO

# Log file path
LOG_FILE = vault/Logs/orchestrator.log

[SECURITY]
# Ensure secrets are never synced
ENFORCE_SECRET_EXCLUSION = True

# Dashboard write access (only Local Executive should have this)
ALLOW_DASHBOARD_WRITE = True